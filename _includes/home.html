<div gap="2rem" flex flexdirection="column">
  <!-- Quick Actions -->
  <div flex gap="1rem" screen-xxs="flexdirection:[column]" screen-md="flexdirection:[row]">
    <a href="browse.html" target="main" flex="1" padding=".8rem 1.4rem" bgcolor="orange" color="white" border="none"
      radius="2rem" cursor="pointer" hover="bgcolor:[darkorange]" textalign="center" globalize-get>▦
      Browse Files</a>
    <a click="click:#upload" target="main" flex="1" padding=".8rem 1.4rem" bgcolor="black" color="white" border="none"
      radius="2rem" cursor="pointer" hover="bgcolor:[#333]" textalign="center" globalize-get>&#43;
      Upload Files</a>
  </div>

  <!-- Stats Grid -->
  <div flex gap="1rem" id="test" flexwrap="wrap">
    <div flex="1" minwidth="150px" padding="1rem" bgcolor="whitesmoke" radius="0.5rem" border="1px solid #ddd">
      <div flex flexdirection="column" gap="0.5rem">
        <small color="gray" globalize-get>Total Files</small>
        <h2 id="fileCount">0</h2>
      </div>
    </div>
    <div flex="1" minwidth="150px" padding="1rem" bgcolor="whitesmoke" radius="0.5rem" border="1px solid #ddd">
      <div flex flexdirection="column" gap="0.5rem">
        <small color="gray" globalize-get>Storage Used</small>
        <h2 id="size">0</h2>
      </div>
    </div>
  </div>

  <!-- Recent Files Section -->
  <h2 margintop="2rem" globalize-get>Recents</h2>
  <table minwidth="100%">
    <thead>
      <th>Name</th>
      <th>Modified</th>
    </thead>
    <tbody>
    <tbody bindvar="src2" storage-bindcookie="auth" bindasset="endpoint:api.file.endpoint" data-src="{endpoint}"
      data-header="Authorization:Bearer {auth}" data-iterate="files" data-sort="files.data.files.modified"
      data-sortorder="desc" data-limit="5" data-bind="size:#size;fileCount:#fileCount">
      <tr style="border-bottom: 1px solid #f0f0f0;" mouseover="bgcolor:[#f9f9f9]" mouseout="bgcolor:[white]">
        <td style="padding: 0.5rem;" data-get="name"></td>
        <td style="padding: 0.5rem; color: gray; font-size: 0.9rem;" data-get="modified"></td>
      </tr>
    </tbody>
  </table>
  <a href="browse.html" target="main" color="orange" globalize-get>View all files →</a>
</div>
</div>
