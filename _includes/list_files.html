<!-- Front data module: nested wildcard iteration maps dynamic object properties. -->
<div id="loader" class="loader"></div>
<div overflow="auto" width="100%" maxheight="70vh" scrollbar--set="width:thin;thumb:black;track:#eeeeee">
  <table width="max-content" minwidth="100%">
    <thead>
      <tr>
        <th scope="col" whitespace="nowrap" style="position:sticky;top:0;z-index:2;background-color:white"></th>
      </tr>
    </thead>
    <tbody
      bindvar="src2"
      storage-bindlocal="auth"
      bindasset="endpoint:api.file.endpoint"
      data-src="{endpoint}"
      data-header="Authorization:Bearer {auth}"
      data-loader="#loader"
      data-iterate="true">
      <tr data-iterate="true" mouseover="bgcolor:[whitesmoke]" mouseout="bgcolor:[inherit]">
        <td data-get="[*]" whitespace="nowrap"></td>
      </tr>
    </tbody>
  </table>
</div>
