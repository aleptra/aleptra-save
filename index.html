<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="version" content="1.0.0">
  <script src="https://cdn.front.nu/nightly/front.js" module="globalize;data;navigate;keyboard;screen;storage;form;auth"
    var="api"
    conf="debug:false;debugLocalhost:true;resetStyle:true;varsDir:assets/json/vars;storageKey:save;resetStyle:true"
    auth-conf="cookieDomain:.aleptra.com" globalize-conf="folder:assets/json/locales"
    navigate-conf="startpage:experimental/app/save;startpageLocal:app/save"
    auth-protect="redirect:/account/login">
    </script>
  <link type="text/css" href="https://cdn.front.nu/dist/front.css" rel="stylesheet">
  <link rel="icon" href="data:,">
  <title>Save</title>
</head>

<body screen-layout="ultimate">
  <div id="navloader" absolute top="0" width="100%" class="navloader bcblack03 h2px" hide>
    <div class="bcblack08"></div>
  </div>
  <header bgcolor="orange" color="white" height="4rem" padding="0 1rem" color="white" class="topbar shade1"
    gap="0.5rem">
    <button click="toggle" clicktargetfield="aside[0]" radius="50%" class="dark hover-" radius="50%" width="40"
      height="40" fontsize="24px">≡</button>
    <div target="_top" href="./" bindglobal="title:title" uppercase bold>{title}</div>
  </header>

  <aside ontoggle="toggle.class[pf t0 zi50]" bgcolor="black09" color="white" screen-xxs="hide" screen-xl="show" flex
    flexdirection="column" height="100%" fontsize="13px" maxwidth="6rem">
    <ul flex flexdirection="column" gap="2rem" alignitems="center" height="100%" margintop="1rem">
      <li flexdirection="column">
        <a href="./" alignitems="center" target="_top" gap="5" flexdirection="inherit">
          <b radius="50%" alignitems="inherit" bgcolor="black" width="42" height="42" justifycontent="center"
            font="32px arial">⌂</b><b>Home</b>
        </a>
      </li>
      <li flexdirection="column">
        <form action="https://api.aleptra.com/_/" method="POST" storage-bindcookie="auth"
          bindasset="endpoint:api.file.endpoint" action="{endpoint}" data-header="Authorization:Bearer {auth}"
          form-onuploadsuccess="alert:[Upload successful]" form-onuploadcancel="alert:[Upload cancelled]"
          enctype="multipart/form-data" flex flexdirection="column">
          <a flexdirection="column" alignitems="center" target="main" gap="5" flexdirection="inherit"
            click="form-upload:[*.*]" id="upload">
            <b radius="50%" alignitems="inherit" bgcolor="black" width="42" height="42" justifycontent="center"
              font="30px arial">&#43;</b><b>Upload</b>
          </a>
        </form>
      </li>
      <a href="browse.html" alignitems="center" target="main" gap="5" flexdirection="inherit">
        <b radius="50%" alignitems="inherit" bgcolor="black" width="42" height="42" justifycontent="center"
          font="28px arial">&#x25A6;</b><b>Browse</b>
        <a hide alignitems="center" gap="5" flexdirection="inherit">
          <b radius="50%" alignitems="inherit" bgcolor="black" width="42" height="42" justifycontent="center"
            font="28px arial">&#8862;</b><b>Shared</b></a>
    </ul>
  </aside>
  <main include="_includes/home.html"></main>
  <aside></aside>
  <footer></footer>
</body>

</html>
